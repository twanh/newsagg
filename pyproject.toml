[project]
name = "news-agg"
version = "0.1.0"
description = "Aggregrate news sources"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-mistralai>=1.1.6",
    "pdbpp>=0.12.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rss-parser>=4.4.1",
    "selenium>=4.49.0",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
]

[tool.ruff.lint]
ignore = ["DTZ001", "DTZ002", "DTZ005"]
